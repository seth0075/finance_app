[project]
name = "finance-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "httplib2>=0.22",
    "httpx>=0.28.1",
    "keyring>=25.0",
    "openai>=3.59.0",
    "pydantic>=2.14.4",
    "pyside6>=6.12.0",
    "sqlalchemy>=2.1.9",
    "tzdata>=2025.1",
]

[project.scripts]
finance-app = "finance_app:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
